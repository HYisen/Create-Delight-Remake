name: 发布版本

on:
  push:
    branches:
      - nightly

env:
  VERSION_FILE_PATH: config/fancymenu/assets/version.md
  PACKWIZ_DOWNLOAD_URL: https://github.com/Jasons-impart/packwiz/releases/latest/download/packwiz
  PACKWIZ_INSTALLER_BOOTSTRAP_URL: https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
  PACKWIZ_FILES_REF: ${{ github.sha }}
  PACKWIZ_FILES_RAW_PREFIX: https://raw.githubusercontent.com/Jasons-impart/Create-Delight-Remake/${{ github.sha }}/packwiz-files/
  HMCL_DOWNLOAD_URL: https://github.com/HMCL-dev/HMCL/releases/download/v3.13.2/HMCL-3.13.2.jar
  JAVA_DOWNLOAD_URL: https://download.oracle.com/java/17/archive/jdk-17.0.12_windows-x64_bin.msi
  FORGE_DOWNLOAD_URL_PREFIX: https://maven.minecraftforge.net/net/minecraftforge/forge
  VERSION_FILE_RELATIVE_DIR_PATH: config/fancymenu/assets/

jobs:
  # 公共步骤（所有分支都需要执行的前置操作）
  common-steps:
    runs-on: ubuntu-latest
    outputs:
      modpack_name: ${{ steps.read-modpackname.outputs.value }}
      modpack_ver: ${{ steps.generate_modpack_version.outputs.VERSION }}
      mc_version: ${{ steps.read-minecraft.outputs.value }}
      forge_version: ${{ steps.read-forge.outputs.value }}
    steps:
      - name: 仅检出需要的文件
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: 'modpack.toml'
      - name: 读取整合包名
        uses: SebRollen/toml-action@v1.2.0
        id: read-modpackname
        with:
          file: modpack.toml
          field: 'name'
      - name: 读取mc版本号
        uses: SebRollen/toml-action@v1.2.0
        id: read-minecraft
        with:
          file: modpack.toml
          field: 'versions.minecraft'
      - name: 读取forge版本号
        uses: SebRollen/toml-action@v1.2.0
        id: read-forge
        with:
          file: modpack.toml
          field: 'versions.forge'
      - name: 生成整合包版本号
        id: generate_modpack_version
        run: |
          VERSION="nightly"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  # 客户端相关任务（并行执行）
  client-tasks:
    needs: common-steps
    runs-on: ubuntu-latest
    env:
      MODPACK_NAME: ${{ needs.common-steps.outputs.modpack_name }}
      MODPACK_VERSION: ${{ needs.common-steps.outputs.modpack_ver }}
      MC_VERSION: ${{ needs.common-steps.outputs.mc_version }}
      FORGE_VERSION: ${{ needs.common-steps.outputs.forge_version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: 安装 Packwiz
        uses: ./.github/actions/setup-packwiz
      - name: 重命名HMCL配置和options
        run: |
          mv .hmclversion.cfg hmclversion.cfg
          mv .options.txt options.txt
      - name: 更新整合包配置与版本信息
        uses: ./.github/actions/update-modpack-config
        with:
          modpack_name: ${{ env.MODPACK_NAME }}
          modpack_version: ${{ env.MODPACK_VERSION }}
          mode: client
      - name: 【鸣谢】更新鸣谢名单及头像
        run: |
          pip install requests
          python .github/workflows/scripts/update_credits.py --mode real --download-images
      - name: 生成不带mod本体的包
        run: |
          bash .github/workflows/scripts/export_curseforge_pack.sh ../lite-release.zip 8083
          unzip -o ../lite-release.zip -d ../lite-release
          ls ..
          git checkout -- mods resourcepacks shaderpacks
          git clean -fd -- mods resourcepacks shaderpacks
      - name: 下载所有客户端文件本体
        run: bash .github/workflows/scripts/download_mods.sh 8082 client
      - name: Workaround actions/upload-artifact#176
        run: echo "artifacts_path=$(realpath ..)" >> $GITHUB_ENV
      - name: 上传不带mod包
        uses: actions/upload-artifact@v4
        with:
          name: "[Client]${{ env.MODPACK_NAME }}-${{ env.MODPACK_VERSION }}"
          path: ${{ env.artifacts_path }}/lite-release/
